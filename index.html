<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TasteCraft — Mazali Taomlar Do'koni</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-hover: #334155;
      --accent: #f97316;
      --accent-hover: #ea580c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent);
      text-decoration: none;
    }

    .cart-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.6rem 1.25rem;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 2rem 1.5rem;
      flex: 1;
      width: 100%;
    }

    .hero {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.2) 0%, rgba(30, 41, 59, 0.8) 100%);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      margin-bottom: 2.5rem;
      text-align: center;
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 1rem;
    }

    .controls {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      margin-bottom: 2.5rem;
    }

    @media (min-width: 768px) {
      .controls {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box input {
      width: 100%;
      max-width: 400px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: white;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      outline: none;
    }

    .categories {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
    }

    .cat-btn {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.5rem 1.25rem;
      border-radius: 0.75rem;
      cursor: pointer;
      font-weight: 500;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .food-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .food-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .food-img-container {
      height: 190px;
      overflow: hidden;
    }

    .food-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .food-info {
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .food-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .food-desc {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin-bottom: 1.25rem;
      flex: 1;
    }

    .food-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .food-price {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--accent);
    }

    .add-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.6rem;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <a href="#" class="logo">🍽️ TasteCraft</a>
      <button class="cart-btn" id="open-cart">🛒 Savat (<span id="cart-count">0</span>)</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Eng shirin taomlar va tezkor yetkazib berish!</h1>
      <p>Sevimli taomlaringizni tanlang va bir necha daqiqada qabul qiling.</p>
    </section>

    <section class="controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Taom qidirish...">
      </div>

      <div class="categories" id="categories-container">
        <button class="cat-btn active" data-category="all">Barchasi</button>
        <button class="cat-btn" data-category="fastfood">Fast Food</button>
        <button class="cat-btn" data-category="national">Milliy</button>
        <button class="cat-btn" data-category="drinks">Ichimliklar</button>
      </div>
    </section>

    <section class="food-grid" id="food-grid"></section>
  </main>

  <script>
    const FOOD_ITEMS = [
      { id: '1', name: 'Gamburger Special', category: 'fastfood', price: 38000, image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600', description: 'Juicy beef patty with fresh lettuce and cheese.' },
      { id: '2', name: 'Osh (Toshkent Palov)', category: 'national', price: 45000, image: 'https://images.unsplash.com/photo-1633964913295-ceb43826e7c9?w=600', description: 'An`anaviy guruch, goʻsht va sabzi bilan pishirilgan oshi.' },
      { id: '3', name: 'Pepperoni Pitsa', category: 'fastfood', price: 75000, image: 'https://images.unsplash.com/photo-1628840042765-356cda07504e?w=600', description: 'Sosiska pepperoni va motzarella pishlogʻi.' },
      { id: '4', name: 'Moxito', category: 'drinks', price: 22000, image: 'https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=600', description: 'Yalpiz va laym qoʻshilgan tetiklantiruvchi ichimlik.' }
    ];

    let cart = [];
    let selectedCategory = 'all';

    const foodGrid = document.getElementById('food-grid');
    const searchInput = document.getElementById('search-input');
    const categoriesContainer = document.getElementById('categories-container');
    const cartCountEl = document.getElementById('cart-count');

    function formatPrice(amount) {
      return amount.toLocaleString('uz-UZ') + ' UZS';
    }

    function renderFoodCards() {
      const query = searchInput.value.toLowerCase();
      const filtered = FOOD_ITEMS.filter(item => {
        const matchesCategory = selectedCategory === 'all' || item.category === selectedCategory;
        const matchesSearch = item.name.toLowerCase().includes(query);
        return matchesCategory && matchesSearch;
      });

      foodGrid.innerHTML = filtered.map(item => `
        <div class="food-card">
          <div class="food-img-container">
            <img src="${item.image}" alt="${item.name}">
          </div>
          <div class="food-info">
            <h3 class="food-title">${item.name}</h3>
            <p class="food-desc">${item.description}</p>
            <div class="food-bottom">
              <span class="food-price">${formatPrice(item.price)}</span>
              <button class="add-btn" onclick="addToCart('${item.id}')">Qo'shish</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    window.addToCart = (id) => {
      const item = FOOD_ITEMS.find(f => f.id === id);
      cart.push(item);
      cartCountEl.textContent = cart.length;
      alert(item.name + " savatga qo'shildi!");
    };

    searchInput.addEventListener('input', renderFoodCards);

    categoriesContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('cat-btn')) {
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        e.target.classList.add('active');
        selectedCategory = e.target.dataset.category;
        renderFoodCards();
      }
    });

    renderFoodCards();
  </script>
</body>
</html>
